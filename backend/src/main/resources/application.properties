server.port=8080

# Spring Application Name
spring.application.name=nool-credit-backend

# Default Embedded H2 for instant plug-and-play hackathon testing
spring.datasource.url=jdbc:h2:mem:nool_credit_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Optional PostgreSQL Configuration (uncomment when running with local/remote Postgres)
# spring.datasource.url=jdbc:postgresql://localhost:5432/nool_credit_db
# spring.datasource.username=postgres
# spring.datasource.password=postgres
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
nool.jwt.secret=noolCreditSuperSecretSecretKeyForHackathon2026ModernFinTechPlatformDemoSecurityKey
nool.jwt.expiration-ms=86400000
